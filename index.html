<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="theme-color" content="#000000" />

        <!--
            Core AR.js / A-Frame stack.
            IMPORTANT: AR.js is pinned to a tagged release (3.4.7) instead of "master".
            Pointing at master means AR.js can change under you without warning and
            silently break camera init — this is a common cause of "camera stopped
            working" reports that have nothing to do with your own code.
        -->
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <!--
            THREE.js post-processing addons for the bloom effect.
            Must match the three.js revision bundled inside A-Frame 1.0.4 (r115).
            If bloom doesn't appear, check `THREE.REVISION` in devtools and swap the
            version below to match.
        -->
        <script src="https://unpkg.com/three@0.115.0/examples/js/shaders/CopyShader.js"></script>
        <script src="https://unpkg.com/three@0.115.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
        <script src="https://unpkg.com/three@0.115.0/examples/js/postprocessing/EffectComposer.js"></script>
        <script src="https://unpkg.com/three@0.115.0/examples/js/postprocessing/RenderPass.js"></script>
        <script src="https://unpkg.com/three@0.115.0/examples/js/postprocessing/ShaderPass.js"></script>
        <script src="https://unpkg.com/three@0.115.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
                width: 100%;
                height: 100%;
                touch-action: none;
                overscroll-behavior: none;
                -webkit-user-select: none;
                user-select: none;
            }

            a-scene {
                width: 100vw;
                height: 100vh;
            }

            #ui-overlay {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 14px 18px calc(20px + env(safe-area-inset-bottom, 0px));
                background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: #fff;
                pointer-events: none;
            }

            #ui-overlay > * {
                pointer-events: auto;
            }

            #day-night-label {
                font-size: 13px;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                opacity: 0.85;
                display: flex;
                justify-content: space-between;
                width: min(340px, 82vw);
            }

            #day-night-slider {
                width: min(340px, 82vw);
                height: 30px;
                -webkit-appearance: none;
                appearance: none;
                background: transparent;
                outline: none;
            }

            #day-night-slider::-webkit-slider-runnable-track {
                height: 6px;
                border-radius: 999px;
                background: linear-gradient(to right, #274b7a, #ffd98a);
            }

            #day-night-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                margin-top: -11px;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 8px rgba(0, 0, 0, 0.55);
                cursor: pointer;
            }

            #day-night-slider::-moz-range-track {
                height: 6px;
                border-radius: 999px;
                background: linear-gradient(to right, #274b7a, #ffd98a);
            }

            #day-night-slider::-moz-range-thumb {
                width: 28px;
                height: 28px;
                border: none;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 8px rgba(0, 0, 0, 0.55);
                cursor: pointer;
            }

            #orientation-warning {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 10000;
                background: #000;
                color: #fff;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                padding: 24px;
            }

            @media (orientation: landscape) and (max-height: 500px) {
                #orientation-warning.enabled {
                    display: flex;
                }
            }

            #camera-error {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 10001;
                background: rgba(0, 0, 0, 0.92);
                color: #fff;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                padding: 32px;
            }

            #camera-error.visible {
                display: flex;
            }

            #camera-error h2 {
                font-size: 18px;
                margin-bottom: 8px;
            }

            #camera-error p {
                font-size: 14px;
                opacity: 0.85;
                max-width: 320px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="antialias: false; precision: mediump; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true; alpha: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
            id="scene"
            embedded
            gesture-detector
            bloom-effect
            day-night-cycle
        >
            <a-assets timeout="15000">
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <!-- Lighting rig: driven live by the day/night slider via day-night-cycle -->
            <a-entity id="sun-light" light="type: directional; castShadow: false; intensity: 1.1; color: #fff3d6" position="-1 2 1"></a-entity>
            <a-entity id="ambient-light" light="type: ambient; intensity: 0.55; color: #ffffff"></a-entity>
            <a-entity id="hemi-light" light="type: hemisphere; color: #bcd8ff; groundColor: #2b2b2b; intensity: 0.6"></a-entity>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="bowser-model"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                    shadow="cast: false; receive: false"
                    auto-fit-model="targetSize: 0.35"
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <div id="ui-overlay">
            <div id="day-night-label">
                <span>☀️ Day</span>
                <span>🌙 Night</span>
            </div>
            <input id="day-night-slider" type="range" min="0" max="100" value="20" />
        </div>

        <div id="orientation-warning">
            <p>Rotate your phone back to portrait for the best AR tracking.</p>
        </div>

        <div id="camera-error">
            <div>
                <h2>Camera unavailable</h2>
                <p id="camera-error-message">Checking camera access…</p>
            </div>
        </div>

        <script>
            // Detect mobile so we can drop render resolution / bloom cost further.
            var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);

            /**
             * Camera preflight check.
             * AR.js's own webcam init fails silently in a lot of common situations —
             * insecure origin (not https/localhost), permission denied, or no camera
             * present. This runs a quick getUserMedia test up front with the rear
             * camera requested explicitly, shows a clear on-screen reason if it fails,
             * and immediately releases the test stream so AR.js can open its own.
             */
            (function cameraPreflight() {
                var errorBox = document.getElementById('camera-error');
                var errorMessage = document.getElementById('camera-error-message');

                function showError(message) {
                    errorMessage.textContent = message;
                    errorBox.classList.add('visible');
                }

                if (!window.isSecureContext) {
                    showError('This page must be served over HTTPS (or http://localhost) for the camera to work. Opening the file directly, or loading it over plain HTTP on a remote host, will block camera access.');
                    return;
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showError('This browser does not support camera access (getUserMedia unavailable). Try an up-to-date Chrome or Safari.');
                    return;
                }

                navigator.mediaDevices
                    .getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
                    .then(function (stream) {
                        // Permission granted — release immediately so AR.js can take over the camera.
                        stream.getTracks().forEach(function (track) { track.stop(); });
                    })
                    .catch(function (err) {
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            showError('Camera permission was denied. Enable camera access for this site in your browser settings and reload.');
                        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                            showError('No camera was found on this device.');
                        } else if (err.name === 'NotReadableError') {
                            showError('The camera is already in use by another app. Close other camera apps/tabs and reload.');
                        } else {
                            showError('Camera error: ' + err.name + '. ' + (err.message || ''));
                        }
                    });
            })();

            /**
             * auto-fit-model
             * Waits for the glTF model to load, measures its real bounding box, then
             * uniformly scales it to a target physical size and re-centers it so it
             * sits upright on the marker. Replaces fragile hardcoded scale values that
             * only worked for one specific .glb's dimensions.
             */
            AFRAME.registerComponent('auto-fit-model', {
                schema: {
                    targetSize: { type: 'number', default: 0.35 } // desired max dimension, in marker-space units
                },
                init: function () {
                    var self = this;
                    this.el.addEventListener('model-loaded', function (evt) {
                        var mesh = evt.detail.model || self.el.getObject3D('mesh');
                        if (!mesh) return;

                        // Reset any prior transform before measuring.
                        mesh.scale.set(1, 1, 1);
                        mesh.position.set(0, 0, 0);
                        mesh.updateMatrixWorld(true);

                        var box = new THREE.Box3().setFromObject(mesh);
                        var size = new THREE.Vector3();
                        box.getSize(size);
                        var center = new THREE.Vector3();
                        box.getCenter(center);

                        var maxDimension = Math.max(size.x, size.y, size.z) || 1;
                        var scaleFactor = self.data.targetSize / maxDimension;

                        // Uniform scale preserves proportions — never scale axes independently.
                        self.el.setAttribute('scale', {
                            x: scaleFactor,
                            y: scaleFactor,
                            z: scaleFactor
                        });

                        // Re-center horizontally and drop the model so its base sits on the marker (y = 0).
                        self.el.setAttribute('position', {
                            x: -center.x * scaleFactor,
                            y: -box.min.y * scaleFactor,
                            z: -center.z * scaleFactor
                        });
                    });
                }
            });

            /**
             * day-night-cycle
             * Reads the slider (0 = full day, 100 = full night) and interpolates
             * light color/intensity. Forwards the "night amount" to bloom-effect
             * so glow strengthens after dark.
             */
            AFRAME.registerComponent('day-night-cycle', {
                init: function () {
                    var self = this;
                    this.slider = document.getElementById('day-night-slider');
                    this.sun = document.getElementById('sun-light');
                    this.ambient = document.getElementById('ambient-light');
                    this.hemi = document.getElementById('hemi-light');

                    this.dayColor = { sun: [1.0, 0.95, 0.84], ambient: [1, 1, 1], hemiSky: [0.74, 0.85, 1.0], hemiGround: [0.4, 0.38, 0.35] };
                    this.nightColor = { sun: [0.55, 0.62, 0.95], ambient: [0.25, 0.28, 0.4], hemiSky: [0.08, 0.1, 0.22], hemiGround: [0.02, 0.02, 0.04] };

                    this.lerp = function (a, b, t) { return a + (b - a) * t; };

                    this.setLightColor = function (el, dayRgb, nightRgb, prop) {
                        prop = prop || 'color';
                        var t = self.slider.value / 100;
                        var r = self.lerp(dayRgb[0], nightRgb[0], t);
                        var g = self.lerp(dayRgb[1], nightRgb[1], t);
                        var b = self.lerp(dayRgb[2], nightRgb[2], t);
                        var hex = '#' + [r, g, b].map(function (c) {
                            return Math.round(c * 255).toString(16).padStart(2, '0');
                        }).join('');
                        var attr = {};
                        attr[prop] = hex;
                        el.setAttribute('light', attr);
                    };

                    var apply = function (v) {
                        var t = v / 100; // 0 = day, 1 = night
                        self.setLightColor(self.sun, self.dayColor.sun, self.nightColor.sun);
                        self.setLightColor(self.ambient, self.dayColor.ambient, self.nightColor.ambient);
                        self.setLightColor(self.hemi, self.dayColor.hemiSky, self.nightColor.hemiSky, 'color');
                        self.setLightColor(self.hemi, self.dayColor.hemiGround, self.nightColor.hemiGround, 'groundColor');

                        self.sun.setAttribute('light', 'intensity', self.lerp(1.2, 0.15, t));
                        self.ambient.setAttribute('light', 'intensity', self.lerp(0.6, 0.2, t));
                        self.hemi.setAttribute('light', 'intensity', self.lerp(0.6, 0.35, t));

                        self.el.emit('daynightchange', { nightAmount: t }, false);
                    };

                    this.slider.addEventListener('input', function (e) { apply(parseFloat(e.target.value)); });
                    this.slider.addEventListener('change', function (e) { apply(parseFloat(e.target.value)); });

                    apply(parseFloat(this.slider.value));
                }
            });

            /**
             * bloom-effect
             * Wires a THREE.EffectComposer (RenderPass + UnrealBloomPass) into the
             * A-Frame render loop. CRITICAL: the composer's render target must be
             * created with an alpha channel (RGBAFormat) and cleared transparently —
             * otherwise the canvas becomes fully opaque and hides the AR.js camera
             * feed sitting behind it, which is why the camera looked "broken" before.
             */
            AFRAME.registerComponent('bloom-effect', {
                init: function () {
                    var sceneEl = this.el;
                    var self = this;

                    sceneEl.addEventListener('renderstart', () => {
                        var renderer = sceneEl.renderer;
                        var camera = sceneEl.camera;
                        var scene = sceneEl.object3D;

                        renderer.setClearColor(0x000000, 0);

                        // Mobile: render bloom pass at half resolution for performance.
                        var resScale = IS_MOBILE ? 0.5 : 1;
                        var w = window.innerWidth * resScale;
                        var h = window.innerHeight * resScale;

                        // Explicit alpha-capable render target — the fix for the
                        // camera-feed-disappears-behind-bloom bug.
                        var renderTarget = new THREE.WebGLRenderTarget(w, h, {
                            minFilter: THREE.LinearFilter,
                            magFilter: THREE.LinearFilter,
                            format: THREE.RGBAFormat,
                            stencilBuffer: false
                        });

                        var renderPass = new THREE.RenderPass(scene, camera);
                        renderPass.clearAlpha = 0;

                        var bloomPass = new THREE.UnrealBloomPass(
                            new THREE.Vector2(w, h),
                            0.55, // strength (base, adjusted live below)
                            0.4,  // radius
                            0.15  // threshold
                        );

                        var composer = new THREE.EffectComposer(renderer, renderTarget);
                        composer.setSize(window.innerWidth, window.innerHeight);
                        composer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
                        composer.addPass(renderPass);
                        composer.addPass(bloomPass);

                        self.composer = composer;
                        self.bloomPass = bloomPass;

                        sceneEl.render = function () {
                            composer.render();
                        };

                        function handleResize() {
                            composer.setSize(window.innerWidth, window.innerHeight);
                        }

                        window.addEventListener('resize', handleResize);
                        window.addEventListener('orientationchange', function () {
                            setTimeout(handleResize, 250);
                        });

                        sceneEl.addEventListener('daynightchange', (e) => {
                            var t = e.detail.nightAmount;
                            bloomPass.strength = 0.35 + t * 1.1;
                            bloomPass.radius = 0.35 + t * 0.25;
                        });
                    });
                }
            });

            // Cap pixel ratio and lock down mobile viewport quirks once the scene is ready.
            document.addEventListener('DOMContentLoaded', function () {
                var scene = document.getElementById('scene');

                scene.addEventListener('loaded', function () {
                    var renderer = scene.renderer;
                    if (renderer) {
                        renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
                    }
                });

                // Optional portrait nudge for phones — AR marker tracking works best upright.
                var warning = document.getElementById('orientation-warning');
                if (IS_MOBILE) {
                    warning.classList.add('enabled');
                }

                // iOS Safari sometimes needs a resize kick after the address bar collapses.
                window.addEventListener('load', function () {
                    setTimeout(function () {
                        window.dispatchEvent(new Event('resize'));
                    }, 300);
                });
            });
        </script>
    </body>
</html>
