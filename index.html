<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AR Day Night</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- GLB Animation -->
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

    <!-- Gesture Controls -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>

    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>


    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;

            font-family: Arial, sans-serif;
        }


        /* -----------------------------------------
           LIGHTING CONTROL
        ----------------------------------------- */

        #lighting-ui {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            width: 280px;

            padding: 14px 18px;

            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.55);

            border-radius: 18px;

            z-index: 99999;

            color: white;

            text-align: center;

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            touch-action: pan-x;
        }


        #lighting-title {

            font-size: 10px;

            letter-spacing: 2px;

            margin-bottom: 8px;

            opacity: 0.8;
        }


        #lighting-controls {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .icon {

            font-size: 18px;

            width: 22px;

            flex-shrink: 0;
        }


        #lighting-slider {

            flex: 1;

            height: 30px;

            margin: 0;

            touch-action: pan-x;
        }


        #lighting-mode {

            margin-top: 5px;

            font-size: 9px;

            letter-spacing: 1px;

            opacity: 0.7;
        }


        @media (max-width: 400px) {

            #lighting-ui {

                width: calc(100vw - 40px);

                bottom: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LIGHTING UI
    ========================================== -->

    <div id="lighting-ui">

        <div id="lighting-title">
            LIGHTING
        </div>


        <div id="lighting-controls">

            <div class="icon">
                ☀
            </div>


            <input
                id="lighting-slider"
                type="range"
                min="0"
                max="100"
                value="0"
                step="1"
            >


            <div class="icon">
                ☾
            </div>

        </div>


        <div id="lighting-mode">
            DAY
        </div>

    </div>



    <!-- =========================================
         AR SCENE
    ========================================== -->

    <a-scene

        id="scene"

        embedded

        vr-mode-ui="enabled: false"

        loading-screen="enabled: false"

        renderer="logarithmicDepthBuffer: true"

        arjs="
            trackingMethod: best;
            sourceType: webcam;
            debugUIEnabled: false;
        "

        gesture-detector
    >


        <!-- =====================================
             ASSETS
        ====================================== -->

        <a-assets>

            <a-asset-item
                id="animated-asset"
                src="assets/asset.glb"
            ></a-asset-item>

        </a-assets>



        <!-- =====================================
             DAY/NIGHT LIGHTING
        ====================================== -->


        <!-- DAY AMBIENT -->

        <a-entity
            id="ambient-light"
            light="
                type: ambient;
                color: #fff4df;
                intensity: 2;
            "
        ></a-entity>


        <!-- SUN -->

        <a-entity
            id="sun-light"
            light="
                type: directional;
                color: #fff0d0;
                intensity: 3;
            "
            position="2 4 3"
        ></a-entity>


        <!-- FILL -->

        <a-entity
            id="fill-light"
            light="
                type: directional;
                color: #dce8ff;
                intensity: 0.5;
            "
            position="-3 2 -2"
        ></a-entity>


        <!-- MOON -->

        <a-entity
            id="moon-light"
            light="
                type: directional;
                color: #8faeff;
                intensity: 0;
            "
            position="-2 4 -3"
        ></a-entity>



        <!-- =====================================
             MARKER
        ====================================== -->

        <a-marker

            id="markerA"

            type="pattern"

            preset="custom"

            url="assets/marker.patt"

            raycaster="objects: .clickable"

            emitevents="true"

            cursor="
                fuse: false;
                rayOrigin: mouse;
            "
        >


            <!-- =================================
                 MODEL
            ================================== -->

            <a-entity

                id="bowser-model"

                scale="
                    0.21617513452299691
                    0.21617513452299691
                    0.21617513452299691
                "

                animation-mixer="loop: repeat"

                gltf-model="#animated-asset"

                class="clickable"

                gesture-handler
            ></a-entity>


        </a-marker>



        <!-- CAMERA -->

        <a-entity camera></a-entity>


    </a-scene>



    <!-- =========================================
         DAY/NIGHT SCRIPT
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                var slider =
                    document.getElementById(
                        "lighting-slider"
                    );


                var mode =
                    document.getElementById(
                        "lighting-mode"
                    );


                var ambient =
                    document.getElementById(
                        "ambient-light"
                    );


                var sun =
                    document.getElementById(
                        "sun-light"
                    );


                var fill =
                    document.getElementById(
                        "fill-light"
                    );


                var moon =
                    document.getElementById(
                        "moon-light"
                    );


                /*
                 * Current lighting value.
                 *
                 * 0 = DAY
                 * 1 = NIGHT
                 */

                var current = 0;

                var target = 0;



                /* ---------------------------------
                   SLIDER
                ---------------------------------- */

                slider.addEventListener(
                    "input",
                    function () {

                        target =
                            parseFloat(
                                slider.value
                            ) / 100;


                        updateMode();

                    }
                );



                /* ---------------------------------
                   LABEL
                ---------------------------------- */

                function updateMode() {

                    var value =
                        parseInt(
                            slider.value
                        );


                    if (value < 20) {

                        mode.innerHTML =
                            "DAY";

                    }
                    else if (value < 40) {

                        mode.innerHTML =
                            "LATE AFTERNOON";

                    }
                    else if (value < 60) {

                        mode.innerHTML =
                            "SUNSET";

                    }
                    else if (value < 80) {

                        mode.innerHTML =
                            "EVENING";

                    }
                    else {

                        mode.innerHTML =
                            "NIGHT";

                    }

                }



                /* ---------------------------------
                   LIGHTING LOOP
                ---------------------------------- */

                function updateLighting() {


                    /*
                     * Smooth interpolation.
                     */

                    current +=
                        (target - current) * 0.08;



                    /* -----------------------------
                       AMBIENT
                    ------------------------------ */

                    var ambientIntensity =
                        2.0 -
                        (1.65 * current);


                    ambient.setAttribute(
                        "light",
                        "intensity",
                        ambientIntensity
                    );



                    /* -----------------------------
                       SUN
                    ------------------------------ */

                    var sunIntensity =
                        3.0 -
                        (2.8 * current);


                    sun.setAttribute(
                        "light",
                        "intensity",
                        sunIntensity
                    );



                    /* -----------------------------
                       FILL
                    ------------------------------ */

                    var fillIntensity =
                        0.5 -
                        (0.42 * current);


                    fill.setAttribute(
                        "light",
                        "intensity",
                        fillIntensity
                    );



                    /* -----------------------------
                       MOON
                    ------------------------------ */

                    var moonIntensity =
                        1.2 * current;


                    moon.setAttribute(
                        "light",
                        "intensity",
                        moonIntensity
                    );



                    requestAnimationFrame(
                        updateLighting
                    );

                }


                /*
                 * Start the lighting loop.
                 */

                updateLighting();


            }

        );

    </script>


</body>

</html>
