<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #start {
            position: fixed;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            padding: 18px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
        }

        #error {
            position: fixed;
            z-index: 20;
            left: 20px;
            right: 20px;
            bottom: 30px;

            padding: 15px;
            background: rgba(0,0,0,.8);
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<button id="start">START CAMERA</button>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<div id="error"></div>

<script>

const video = document.getElementById("video");
const button = document.getElementById("start");
const error = document.getElementById("error");

button.addEventListener("click", async () => {

    try {

        error.style.display = "none";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        button.style.display = "none";

    } catch (err) {

        console.error(err);

        error.innerHTML =
            "Camera error:<br>" +
            err.name + "<br>" +
            err.message;

        error.style.display = "block";
    }

});

</script>

</body>
</html>
