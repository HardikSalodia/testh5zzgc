<!doctype html>
<html>
    <head>
        <title>AR.js Interactive Model</title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <script>
            AFRAME.registerComponent('click-interaction', {
                init: function () {
                    const el = this.el;
                    const originalScale = el.getAttribute('scale');
                    
                    // Listen for click or tap events
                    el.addEventListener('click', function () {
                        console.log('Model was clicked/tapped!');
                        
                        // Interaction 1: Briefly scale the model up (a "bump" effect)
                        el.setAttribute('scale', '0.3 0.3 0.3');
                        
                        // Return to original scale after 300ms
                        setTimeout(() => {
                            el.setAttribute('scale', originalScale);
                        }, 300);

                        // Interaction 2: You can add more here (e.g., play a sound, change a color)
                    });
                }
            });
        </script>
    </head>
    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
            cursor="fuse: false; rayOrigin: mouse;"
            raycaster="objects: .clickable"
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                emitevents="true"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.216 0.216 0.216"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                    click-interaction
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
