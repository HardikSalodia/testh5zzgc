<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #button {
            position: fixed;
            z-index: 10;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border: 0;
            border-radius: 30px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <video id="video" autoplay playsinline muted></video>

    <button id="button">
        START CAMERA
    </button>

    <script>
        const video = document.getElementById("video");
        const button = document.getElementById("button");

        button.addEventListener("click", async () => {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });

                video.srcObject = stream;

                button.style.display = "none";

            } catch (error) {

                console.error(error);

                alert(
                    "Camera error: " +
                    error.name +
                    "\n" +
                    error.message
                );

            }

        });
    </script>

</body>
</html>
