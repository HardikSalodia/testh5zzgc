```html
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Camera Lighting Test</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

            font-family: Arial, sans-serif;

        }


        /* =========================================
           CAMERA
        ========================================= */

        #video {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;

        }


        /* =========================================
           LIGHTING FILTER

           This changes the appearance of the
           camera feed without modifying the
           actual camera exposure.
        ========================================= */

        #lighting-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 2;

            pointer-events: none;

            background: rgb(255, 255, 255);

            opacity: 0;

            mix-blend-mode: multiply;

        }


        /* =========================================
           CAMERA BUTTON
        ========================================= */

        #button {

            position: fixed;

            z-index: 10;

            bottom: 150px;

            left: 50%;

            transform: translateX(-50%);

            padding: 15px 25px;

            border: none;

            border-radius: 30px;

            font-size: 16px;

            background: white;

            color: black;

        }


        /* =========================================
           LIGHTING UI
        ========================================= */

        #lighting-ui {

            position: fixed;

            z-index: 20;

            left: 50%;

            bottom: 25px;

            transform: translateX(-50%);

            width: calc(100% - 40px);

            max-width: 360px;

            box-sizing: border-box;

            padding: 15px 18px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.55);

            border: 1px solid rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            color: white;

            text-align: center;

            touch-action: pan-x;

        }


        #lighting-title {

            font-size: 10px;

            letter-spacing: 2px;

            margin-bottom: 10px;

            opacity: 0.8;

        }


        #lighting-controls {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .icon {

            font-size: 20px;

            width: 25px;

            flex-shrink: 0;

        }


        #lighting-slider {

            flex: 1;

            width: 100%;

            height: 30px;

            margin: 0;

            touch-action: pan-x;

            cursor: pointer;

        }


        #lighting-mode {

            margin-top: 7px;

            font-size: 9px;

            letter-spacing: 1.5px;

            opacity: 0.7;

        }

    </style>

</head>


<body>


    <!-- =========================================
         CAMERA
    ========================================== -->

    <video
        id="video"
        autoplay
        playsinline
        muted
    ></video>


    <!-- =========================================
         LIGHTING OVERLAY
    ========================================== -->

    <div id="lighting-overlay"></div>


    <!-- =========================================
         CAMERA BUTTON
    ========================================== -->

    <button id="button">
        START CAMERA
    </button>


    <!-- =========================================
         LIGHTING CONTROL
    ========================================== -->

    <div id="lighting-ui">

        <div id="lighting-title">
            LIGHTING
        </div>


        <div id="lighting-controls">

            <div class="icon">
                ☀
            </div>


            <input
                id="lighting-slider"
                type="range"
                min="0"
                max="100"
                value="0"
                step="1"
            >


            <div class="icon">
                ☾
            </div>

        </div>


        <div id="lighting-mode">
            DAY
        </div>

    </div>


    <script>

        const video =
            document.getElementById("video");


        const button =
            document.getElementById("button");


        const slider =
            document.getElementById("lighting-slider");


        const overlay =
            document.getElementById("lighting-overlay");


        const mode =
            document.getElementById("lighting-mode");



        /* =========================================
           START CAMERA
        ========================================== */

        button.addEventListener(
            "click",
            async function () {

                try {

                    const stream =
                        await navigator.mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: {
                                    ideal: "environment"
                                }

                            },

                            audio: false

                        });


                    video.srcObject = stream;


                    button.style.display = "none";


                } catch (error) {

                    console.error(error);


                    alert(
                        "Camera error:\n" +
                        error.name +
                        "\n" +
                        error.message
                    );

                }

            }
        );



        /* =========================================
           LIGHTING SLIDER
        ========================================== */

        slider.addEventListener(
            "input",
            function () {

                const value =
                    Number(slider.value);


                /*
                 * 0 = Day
                 * 100 = Night
                 */

                const night =
                    value / 100;



                /* =================================
                   DAY
                ================================== */

                if (value < 20) {

                    mode.textContent =
                        "DAY";


                    overlay.style.background =
                        "rgb(255, 255, 255)";


                    overlay.style.opacity =
                        "0";


                    video.style.filter =
                        "brightness(1) saturate(1)";

                }



                /* =================================
                   AFTERNOON
                ================================== */

                else if (value < 40) {

                    mode.textContent =
                        "LATE AFTERNOON";


                    overlay.style.background =
                        "rgb(255, 190, 100)";


                    overlay.style.opacity =
                        "0.08";


                    video.style.filter =
                        "brightness(0.96) saturate(1.05)";

                }



                /* =================================
                   SUNSET
                ================================== */

                else if (value < 60) {

                    mode.textContent =
                        "SUNSET";


                    overlay.style.background =
                        "rgb(255, 120, 60)";


                    overlay.style.opacity =
                        "0.16";


                    video.style.filter =
                        "brightness(0.88) saturate(1.08)";

                }



                /* =================================
                   EVENING
                ================================== */

                else if (value < 80) {

                    mode.textContent =
                        "EVENING";


                    overlay.style.background =
                        "rgb(70, 90, 160)";


                    overlay.style.opacity =
                        "0.18";


                    video.style.filter =
                        "brightness(0.72) saturate(0.9)";

                }



                /* =================================
                   NIGHT
                ================================== */

                else {

                    mode.textContent =
                        "NIGHT";


                    overlay.style.background =
                        "rgb(20, 40, 100)";


                    overlay.style.opacity =
                        "0.32";


                    video.style.filter =
                        "brightness(0.52) saturate(0.72)";

                }

            }
        );


    </script>

</body>

</html>
